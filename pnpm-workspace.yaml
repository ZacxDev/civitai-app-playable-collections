# Single-package repo. The root has to be declared explicitly or pnpm — and
# `actions/setup-node`'s `cache: pnpm` — error with "packages field missing or
# empty" the moment this file exists at all.
packages:
  - '.'

# pnpm's default `minimumReleaseAge` gate refuses to install package versions
# published very recently. Without these exclusions `pnpm import` and
# `pnpm install` both fail outright (ERR_PNPM_RESOLUTION_POLICY_VIOLATIONS_*) —
# measured on this repo, 2 violations before this block existed.
#
# Every entry is a Civitai first-party package pinned in package.json, and the
# version listed is the one package-lock.json already resolved to, so nothing
# here loosens what the app builds against:
#   - @civitai/app-sdk@0.38.0     — the block message/type contract: BLOCK_SCOPES
#     (incl. the 4-segment `apps:storage:shared:*`), `defineBlock`, the tip and
#     collection payload shapes src/types.ts mirrors.
#   - @civitai/blocks-react@0.48.0 — the hooks + IframeTransport, the host follow
#     bridge used by 0.2.10, and the `/testing` mock host every *.test.tsx and
#     the dev Harness mount against.
#     🔴 `|| 0.62.0` ADDED BY `pnpm install` ITSELF, and it is LOAD-BEARING TODAY,
#     not convention. This repo's pinned pnpm 11 applies a BUILT-IN 24h
#     `minimumReleaseAge` — `pnpm config get minimumReleaseAge` prints
#     `undefined`, which means "the default is in force", NOT "the gate is off".
#     THE CLOCK: pnpm's own refusal names 2026-10-02T04:00:25.000Z, and that is
#     the figure the gate uses, so it is the one to trust here. ⚠️ `npm view
#     @civitai/blocks-react time --json` reports 2026-10-02T04:02:03.809Z for the
#     same version — 98s later. Two registry fields, not a transcription error;
#     quote pnpm's, because pnpm is what fails. So until ~2026-10-03T04:00Z every
#     `pnpm install --frozen-lockfile` — exactly what `.github/workflows/ci.yml`
#     runs — FAILS with ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION unless this version
#     is excluded. MEASURED BOTH WAYS on this change: with the entry, rc=0; with
#     this one line removed and nothing else changed, rc=1 and that error.
#     The entry goes inert at that moment; delete it then, not before.
#     ⚠️ APPEND, do not replace: that is what pnpm wrote on its own here, and what
#     the 0.48.0 -> `0.48.0 || 0.49.0` edit did. The older alternatives are long
#     past their own clocks and are therefore inert rather than wrong; pruning
#     them is a separate, purely cosmetic edit.
#   - @civitai/components@0.4.1    — the attribute-driven CSS primitives the skin
#     (src/skin.css) is written on top of.
#   - @civitai/theme@0.3.1         — the `--civitai-*` design tokens (src/theme.ts,
#     src/bootTheme.ts). 0.3.1 is the latest published; do not bump blindly.
#   - @civitai/sdk@0.8.0           — the REST clients this app's runtime hooks are
#     being rebound onto (src/lib/sdk-transport.ts). Added here because
#     b157419 pinned it in package.json and pnpm-lock.yaml without the entry
#     CLAUDE.md's release protocol requires in the same commit; that commit ran
#     under the host's pnpm 10.28.1, where `minimumReleaseAge` does not exist,
#     so the omission could not fail locally while the pinned pnpm 11 refuses
#     the install outright.
#     🔴 THE CLOCK, NOT A CONDITION ON US: 0.8.0 was published
#     2026-09-27T02:04:53Z — read from `npm view @civitai/sdk time --json`, which
#     is the only authority on it; an earlier revision of this comment guessed
#     02:03:55Z and was 58s early. pnpm 11's 24h `minimumReleaseAge` therefore
#     clears it at 2026-09-28T02:04:53Z, and this entry is inert from that
#     moment — delete it then, not before: until it passes, dropping the entry
#     makes `pnpm install` fail outright under the pinned pnpm 11.
#     An EXACT version on purpose — a bare `@civitai/sdk` would exempt
#     every future release, including one cut by a compromised token.
# All resolve straight from the npm registry — no `link:`/`overrides`.
minimumReleaseAgeExclude:
  - '@civitai/app-sdk@0.38.0 || 0.39.0'
  - '@civitai/blocks-react@0.48.0 || 0.49.0 || 0.62.0'
  - '@civitai/components@0.4.1'
  - '@civitai/theme@0.3.1'
  - '@civitai/sdk@0.8.0'
