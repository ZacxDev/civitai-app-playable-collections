<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      🔴 DARK FIRST, and the order is the decision, not formatting. `color-scheme`
      resolves left-to-right against the viewer's preference, so `light dark` paints
      the UA canvas LIGHT for a viewer with NO preference. Everywhere in this app an
      unknown theme now means DARK (src/bootTheme.ts, the boot styles below, and the
      pre-`ready` commit in src/App.tsx). Keep them in step.
    -->
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Play through a Civitai collection's images and videos like a media player — slideshow, ticker, and wall modes, with creator + curator Buzz tips." />
    <!-- Open Graph / Twitter card for a shared collection link (Feature #6). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Civitai" />
    <meta property="og:title" content="Playable Collections" />
    <meta property="og:description" content="Sit back and play through a Civitai collection's images and videos — slideshow, ticker, or wall." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Playable Collections" />
    <meta name="twitter:description" content="Sit back and play through a Civitai collection's images and videos — slideshow, ticker, or wall." />
    <title>Playable Collections — Civitai App</title>
    <!--
      🔴 NO INLINE FRAGMENT READER HERE, DELIBERATELY — and this is the one place
      this file diverges from the other apps in this rollout.

      The init-fragment fast path needs the block to ship a decoding SDK. This app
      pins `@civitai/app-sdk@0.27.0`, which exports NEITHER
      `parseBlockInitFragment` NOR `encodeBlockInitFragment` (measured: 0 files in
      dist mention either). `BLOCK_INIT_FRAGMENT_ALLOWLIST` in the civitai repo says
      an entry should be added "only once THAT block is known to ship a decoding
      SDK", so this block cannot be allowlisted as pinned — the host will never
      append a fragment to its iframe URL.

      Hand-rolling a reader anyway would ship a duplicate of a wire format this app
      cannot consume, with no encoder available to pin it against — untestable
      duplication guarding a path that cannot fire. So the boot theme here is the OS
      query with a dark default, which is exactly what `bootThemeGuess()` falls back
      to, so the stylesheet and the React commit still agree.

      To enable the fast path later: bump the SDK, add the reader + its
      encoder-parity test, then allowlist the blockId.
    -->
    <!--
      ───────────────────────────────────────────────────────────────────────────
      BOOT SKELETON — paints before any script, and is what `bootSkeleton: true` in
      block.manifest.json entitles the host to rely on.
      ───────────────────────────────────────────────────────────────────────────

      With `bootSkeleton: true` the full-page run host stands down its own loading
      treatment: no opaque veil, the iframe is `opacity: 1` from mount, no reveal
      transition. The consequence is blunt — with that key set over an EMPTY `#root`
      the viewer sees a blank iframe for the whole load, strictly worse than not
      opting in. So the markup in `#root` below is load-bearing.

      🔴 WHY THE COLOURS ARE LITERALS HERE AND VAR REFERENCES EVERYWHERE ELSE.
      src/theme.ts is `var(--civitai-*)` with zero hardcoded colour, and those tokens
      arrive with `@civitai/theme/styles.css` — which Vite emits as a render-blocking
      `<link>`, i.e. one round trip that has NOT completed during the window this file
      exists to cover. An inline style cannot reference a token that has not loaded,
      so the values below are copied from `@civitai/theme`'s own blocks and
      src/bootTokens.test.ts asserts each against the INSTALLED package.

      🔴 IN LIGHT, `body == surface == surface-2` (all #fefefe) in this design
      system. So a placeholder cannot be a surface fill or it is invisible
      white-on-white; it is a `color-mix()` of text into surface, exactly as
      `elevate()` does in src/theme.ts, which reads in BOTH themes.

      Removal needs no code: `createRoot(container).render(...)` in src/main.tsx
      clears the container's children before its first commit. That is MEASURED in
      src/bootSkeleton.test.tsx against this very markup — it is a React behaviour
      and does not generalise to frameworks that append.
    -->
    <style>
      /* The app sets these in its own stylesheet, which arrives with the bundle —
         i.e. after this paint. Without them the skeleton is inset by the UA's
         default 8px body margin and then jumps when the bundle lands. */
      html {
        /* The strong guarantee, independent of `color-scheme` support entirely.
           --civitai-color-body under [data-theme='dark']. */
        background: #1a1b1e;
      }

      body {
        margin: 0;
      }

      :root {
        color-scheme: dark light;
        font-family:
          -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif;

        /* DARK — the base, unconditioned values, from @civitai/theme
           [data-theme='dark']. */
        --pc-boot-body: #1a1b1e;
        --pc-boot-text: #c1c2c5;
        --pc-boot-surface: #1a1b1e;
      }

      @media (prefers-color-scheme: light) {
        html {
          background: #fefefe;
        }

        :root {
          /* LIGHT — @civitai/theme `:root`. */
          --pc-boot-body: #fefefe;
          --pc-boot-text: #222;
          --pc-boot-surface: #fefefe;
        }
      }

      /* ---- geometry ----

         Copied from what the first React commit paints:
           page root -> `pageStyle()` (src/theme.ts)
           loading   -> the `!ready || !canFetch` branch of src/App.tsx: a
                        HORIZONTAL row (`margin: auto`, flex, gap 10, centred), a
                        small `<Loader size="sm">` beside one line of dimmed text —
                        which is why this skeleton is a row, not a column.

         🔴 THE SPINNER IS DELIBERATELY NOT REPRODUCED — pack-owned, undeclared in
         this repo, and a bump would drift any pinned value. */
      [data-boot-skeleton] {
        box-sizing: border-box;
        width: 100%;
        min-height: 100dvh;
        display: flex;
        background: var(--pc-boot-body);
      }

      [data-boot-skeleton] [data-boot-stack] {
        margin: auto;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* `color-mix` of text into surface — `elevate()` in src/theme.ts. A surface
         fill would be invisible in light, where body == surface. */
      [data-boot-skeleton] [data-boot-dot] {
        box-sizing: border-box;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: color-mix(in srgb, var(--pc-boot-text) 18%, var(--pc-boot-surface));
      }

      [data-boot-skeleton] [data-boot-label] {
        box-sizing: border-box;
        display: block;
        width: 210px;
        height: 12px;
        border-radius: 6px;
        background: color-mix(in srgb, var(--pc-boot-text) 12%, var(--pc-boot-surface));
      }

      /* A slow, low-amplitude breath so the boot state reads as "loading" rather
         than "this is the content". */
      @keyframes pc-boot-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.62;
        }
      }

      [data-boot-skeleton] [data-boot-dot],
      [data-boot-skeleton] [data-boot-label] {
        animation: pc-boot-pulse 1.6s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
      [data-boot-skeleton] [data-boot-dot],
      [data-boot-skeleton] [data-boot-label] {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        `data-boot-skeleton` is an ATTRIBUTE, not a class: classes are mangled by
        CSS-modules / purge, an attribute survives the bundler and is
        deterministically greppable out of the built HTML. `aria-hidden` because the
        host already publishes `aria-busy` on the iframe element while this is on
        screen — an in-frame live region would announce a second time.

        It MUST stay a descendant of #root: a skeleton painted as a sibling is never
        replaced by React's render and stays on screen after mount.
      -->
      <div data-boot-skeleton aria-hidden="true">
        <div data-boot-stack>
          <div data-boot-dot></div>
          <span data-boot-label></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
